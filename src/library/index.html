<!doctype html><html lang="zh-CN" data-theme="auto"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>页灯 · 文献库</title><link rel="icon" href="/icons/32.png"><link rel="stylesheet" href="../styles/tokens.css"><link rel="stylesheet" href="./library.css"></head><body><div class="wrap"><header class="head"><a class="brand" href="./index.html"><img src="/icons/brand.svg" width="34" height="34" alt=""><span>页灯 <small>YEDENG</small></span></a><div class="row"><a href="../options/index.html#data">资料与备份</a><button id="btn-settings">设置</button></div></header><div class="library-hero"><div><p class="eyebrow">KEEP READING, KEEP THINKING</p><h1>接着上次，继续读。</h1><p>让读过的每一页，都能找回来。</p></div><button id="btn-import-pdf" class="primary">＋ 导入 PDF</button></div><div class="library-toolbar"><label class="search-label"><span>搜索文献</span><input id="search" type="search" placeholder="搜索标题或作者" aria-label="搜索标题或作者"></label><button id="btn-new-folder">新建文件夹</button><button id="btn-manage">管理文献</button></div><section id="manage-panel" class="management" hidden aria-label="整理文献"><div class="row"><h2>整理重复文件</h2><button id="btn-manage-close">返回文献库</button></div><p>只检查内容完全相同的 PDF；先预览，再合并。合并前建议完整备份，批注和原图会保留。</p><button id="btn-dedup">检查重复文件</button><p id="dedup-preview" role="status"></p><button id="btn-dedup-confirm" disabled>合并这些重复文件</button><a href="../options/index.html#data">备份与恢复 →</a></section><div class="layout"><nav id="folders" class="folders" aria-label="文献分类"></nav><main><div class="list-head"><h2 id="view-title">最近阅读</h2><span id="document-count"></span></div><div id="grid" class="grid"></div></main></div></div><script type="module" src="./library.ts"></script></body></html>
