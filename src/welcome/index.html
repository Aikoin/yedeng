<!doctype html><html lang="zh-CN" data-theme="auto"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>开始使用页灯</title><link rel="icon" href="/icons/32.png"><link rel="stylesheet" href="./welcome.css"></head><body><main><header><img src="/icons/brand.svg" width="48" height="48" alt=""><span>页灯 YEDENG</span></header><p class="eyebrow">YOUR PAPER. YOUR PACE.</p><h1>让难懂的一页，<br>读得更明白。</h1><p class="intro">连接你自己的 AI 服务，解释文字、图表与公式。保存配置不会发起模型请求；也可以先阅读、划线和做笔记。</p><form id="setup"><label>模型服务<select id="service"><option value="deepseek">DeepSeek</option><option value="custom">其他兼容服务</option></select></label><label>服务地址<input id="base-url" type="url" required value="https://api.deepseek.com/v1" spellcheck="false" autocomplete="off"></label><label>API Key<input id="api-key" type="password" required placeholder="仅保存在本机，请勿发到聊天中" autocomplete="off"></label><label>文字模型<input id="text-model" required value="deepseek-flash" list="text-models" spellcheck="false"><datalist id="text-models"><option value="deepseek-flash"><option value="deepseek-v4-pro"></datalist></label><p id="route-hint" class="hint">文字模型可选择 Flash / Pro；含图片的任务自动使用 Flash。</p><label id="vision-label" hidden>支持图片的模型（可选）<input id="vision-model" placeholder="服务商明确支持图片的模型名" spellcheck="false"></label><button type="submit" id="save">保存并开始阅读 →</button></form><p id="status" role="status"></p><nav><button id="skip">先不配置，直接阅读</button><a href="../options/index.html">查看设置</a></nav><section><h2>开始阅读，只需三步</h2><ol><li>打开 PDF，选中文字，解释或翻译。</li><li>在正文框选图表或公式，直接讲解，也可以置顶对照。</li><li>点击已有高亮或下划线，可直接改色或删除。</li></ol></section></main><script type="module" src="./welcome.ts"></script></body></html>
